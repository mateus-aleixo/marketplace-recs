# The asynchronous path on one machine: events through Redpanda into Redis, read by the API.
#
#   docker compose up -d --build
#   python -m marketplace_recs.stream replay --speed 600     # from the host, port 19092
#
# With the monitoring profile, also the drift check, Prometheus and Grafana, whose dashboard
# is at http://localhost:3000:
#
#   docker compose --profile monitoring up -d --build
#   python -m marketplace_recs.traffic --minutes 20          # real traffic through the API
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]

  api:
    build: .
    image: marketplace-recs:local
    environment:
      RECS_SESSIONS: redis://redis:6379/0
      RECS_KAFKA: redpanda:9092
      WEB_CONCURRENCY: "2"
      # The feature rows of a fifth of requests go to Redis for the drift check.
      RECS_DRIFT_SAMPLE: "0.2"
      # Two workers are two processes: their metrics are summed through this directory.
      PROMETHEUS_MULTIPROC_DIR: /tmp/metrics
    tmpfs: ["/tmp/metrics"]
    ports: ["8080:8080"]
    # The host's model/ replaces the one baked into the image, so a version the nightly
    # job publishes (python -m marketplace_recs.pipeline <day>) is served on the next request.
    volumes: ["./model:/app/model"]
    depends_on:
      redpanda: {condition: service_healthy}
      redis: {condition: service_started}

  consumer:
    image: marketplace-recs:local
    command: ["python", "-m", "marketplace_recs.stream", "consume"]
    environment:
      RECS_KAFKA: redpanda:9092
      RECS_REDIS: redis://redis:6379/0
      RECS_METRICS_PORT: "9101"
    depends_on:
      redpanda: {condition: service_healthy}
      redis: {condition: service_started}

  drift:
    image: marketplace-recs:local
    profiles: [monitoring]
    command: ["python", "-m", "marketplace_recs.drift", "serve"]
    environment:
      RECS_REDIS: redis://redis:6379/0
      RECS_METRICS_PORT: "9102"
    # The serving version's name tells the check when a new baseline is due.
    volumes: ["./model:/app/model"]
    depends_on:
      redis: {condition: service_started}

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      # A local dashboard: anyone who can reach the port may look, nobody may edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/recs.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
