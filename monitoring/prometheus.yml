# Every 5 s: the API, the stream consumer and the drift check (docker-compose.yml).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8080"]}]
  - job_name: consumer
    static_configs: [{targets: ["consumer:9101"]}]
  - job_name: drift
    static_configs: [{targets: ["drift:9102"]}]
