name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (no data, no network)
        run: pytest

  image:
    name: serving image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (model/ holds only .gitkeep in git)
        run: docker build -t marketplace-recs:ci .
      - name: Assert the serving image has no data stack
        run: |
          for mod in polars pyarrow; do
            if docker run --rm marketplace-recs:ci python -c "import $mod" 2>/dev/null; then
              echo "::error::$mod reached the serving image" && exit 1
            fi
          done
          docker image inspect marketplace-recs:ci --format 'image size: {{.Size}} bytes'
      - name: Without a model it starts, reports it, and answers 503
        run: |
          docker run -d --name api -p 8080:8080 marketplace-recs:ci
          for _ in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health | grep -q '"model":"missing"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/recommend \
            -H 'Content-Type: application/json' -d '{"events":[{"product_id":1}]}')
          test "$code" = "503"
          docker rm -f api

  stream:
    name: event stream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Redpanda, Redis, the API and the consumer
        run: docker compose up -d --build --wait
      - name: Events posted to the API reach shared state through Redpanda
        run: |
          for _ in $(seq 1 60); do curl -sf localhost:8080/health && break; sleep 2; done
          curl -sf localhost:8080/health | grep -q '"events":"kafka"'
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
              -X POST localhost:8080/sessions/ci/events -d "{\"product_id\": $i}")
            test "$code" = "202"
          done
          n=0
          for _ in $(seq 1 150); do
            n=$(curl -s localhost:8080/sessions/ci | python3 -c 'import sys, json; print(json.load(sys.stdin).get("events", 0))' 2>/dev/null || echo 0)
            [ "$n" = "10" ] && break
            sleep 0.2
          done
          echo "events in shared state: $n"
          test "$n" = "10"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
