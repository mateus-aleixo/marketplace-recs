[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-recs"
version = "0.1.0"
description = "Session recommendations for an online marketplace: co-visitation candidates and a LightGBM ranker, evaluated on a time split of 42 million real events."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mateus Aleixo", email = "mateusfilipealeixo@gmail.com" }]
keywords = ["recommender-systems", "learning-to-rank", "lightgbm", "session-based", "e-commerce"]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# The data stack: building events, cases, matrices and features.
data = [
    "polars>=2.0",
    "pyarrow>=15",
    # Windows ships no time zone database, and every UTC timestamp needs one.
    "tzdata>=2024.1",
    "httpx>=0.27",
]
train = [
    "marketplace-recs[data]",
    "lightgbm>=4.3",
]
# The serving image: no polars, no pyarrow.
serve = [
    "lightgbm>=4.3",
    "fastapi>=0.110",
    # [standard] brings uvloop: on plain asyncio every request on a kept-alive connection
    # took 44 ms instead of 2 (see README, "Serving").
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
    # Shared session state and the event stream.
    "redis>=5.0",
    "confluent-kafka>=2.4",
]
dev = [
    "marketplace-recs[train,serve]",
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
    "fakeredis>=2.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Same rule set as the other portfolio repos.
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
